<title>Rehearse the Show</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#F7F5F0; --surface:#FFFFFF; --raise:#FBFAF7; --line:#E3DFD6; --line-2:#CFC9BC;
  --text:#151A21; --muted:#67707C; --accent:#B8791B; --accent-ink:#FFFFFF;
  --p-s:#1E86AC; --p-a:#7B45B8; --p-t:#2F7C43; --p-b:#C1382A; --p-k:#5C6B7C;
  --shadow:0 1px 2px rgba(20,26,34,.08), 0 8px 24px -12px rgba(20,26,34,.18);
  --track:#E3DFD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#0E1218; --surface:#161C25; --raise:#1D2530; --line:#28313D; --line-2:#3A4654;
    --text:#E9EEF5; --muted:#8D9BAC; --accent:#F2A83C; --accent-ink:#191007;
    --p-s:#4FC3E8; --p-a:#C08BF0; --p-t:#6BBF7A; --p-b:#EE6A5F; --p-k:#8A9AAC;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
    --track:#28313D;
  }
}
:root[data-theme="dark"]{
  --ink:#0E1218; --surface:#161C25; --raise:#1D2530; --line:#28313D; --line-2:#3A4654;
  --text:#E9EEF5; --muted:#8D9BAC; --accent:#F2A83C; --accent-ink:#191007;
  --p-s:#4FC3E8; --p-a:#C08BF0; --p-t:#6BBF7A; --p-b:#EE6A5F; --p-k:#8A9AAC;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -14px rgba(0,0,0,.7);
  --track:#28313D;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--ink); color:var(--text);
  font:400 15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:430px; margin:0 auto; min-height:100vh; background:var(--ink);
  border-inline:1px solid var(--line); display:flex; flex-direction:column;}
@media (max-width:440px){ .shell{border-inline:none} }

/* ---------- header ---------- */
.top{position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line); padding:12px 16px 10px;}
.eyebrow{font:500 10px/1 "IBM Plex Sans",sans-serif; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);}
.songrow{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:5px;}
.song{font:500 25px/1.05 Oswald, "Arial Narrow", sans-serif; letter-spacing:.01em; text-wrap:balance;}
.keysig{font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--muted); white-space:nowrap;}
.counter{display:flex; align-items:center; gap:14px; margin-top:10px;}
.bigbar{font:500 30px/1 "IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;}
.bigbar small{font-size:12px; color:var(--muted); font-weight:400; margin-left:3px}
.beats{display:flex; gap:5px; margin-left:auto}
.beat{width:9px; height:9px; border-radius:50%; background:var(--track);
  transition:background .07s linear, transform .07s linear}
.beat.on{background:var(--muted)}
.beat.on.one{background:var(--accent); transform:scale(1.35)}

/* ---------- scroll body ---------- */
.body{flex:1; padding:16px 16px 128px; display:flex; flex-direction:column; gap:20px}
.block{display:flex; flex-direction:column; gap:9px}
h2{font:500 11px/1 "IBM Plex Sans",sans-serif; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:0}
.h2row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.mini{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:7px; padding:5px 10px; font:500 10px/1 inherit; font-family:inherit; cursor:pointer;
  letter-spacing:.1em; text-transform:uppercase; transition:background .15s,color .15s,border-color .15s}
.mini[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.mini:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.notice{display:flex; gap:9px; align-items:flex-start; margin-top:10px; padding:9px 11px;
  border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  background:color-mix(in srgb, var(--accent) 9%, transparent);
  border-radius:9px; font-size:11.5px; line-height:1.45; color:var(--text)}
.notice b{color:var(--accent); font-weight:600}

/* ---------- my part ---------- */
.parts-pick{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.pick{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:9px; padding:9px 0 8px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; font-family:inherit; transition:border-color .15s, color .15s, background .15s}
.pick b{font:600 15px/1 Oswald,"Arial Narrow",sans-serif}
.pick span{font-size:9px; letter-spacing:.06em; text-transform:uppercase}
.pick[aria-pressed="true"]{background:var(--raise); color:var(--text); border-color:currentColor}
.pick:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- standalone load screen ---------- */
.loadscreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
.loadbox{max-width:340px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center}
.loadtitle{font:500 18px/1.3 Oswald,"Arial Narrow",sans-serif}
.loadmsg{font-size:13px; line-height:1.5; color:var(--muted)}

/* ---------- drive panel ---------- */
.drivebody{display:flex; flex-direction:column; gap:10px}
.drivehint{margin:0; font-size:11.5px; line-height:1.5; color:var(--muted)}
.drivehint b{color:var(--text); font-weight:500}
.drivehint.error{color:var(--p-b)}
.drivehint code{font:400 10.5px/1 "IBM Plex Mono",monospace; background:var(--raise);
  padding:1px 4px; border-radius:4px; border:1px solid var(--line)}
.drivegroup{display:flex; flex-direction:column; gap:2px}
.drivelabel{font:500 10px/1 "IBM Plex Sans",sans-serif; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:4px}
.driverow{padding:8px 10px; background:var(--surface); border:1px solid var(--line); border-radius:9px}
.driverow + .driverow{margin-top:5px}
.driverowmain{font-size:12.5px; font-weight:500}
.driverowsub{font-size:11px; color:var(--muted); margin-top:2px}
.driverowsub a{color:var(--accent)}

/* ---------- presets ---------- */
.chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:3px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none; white-space:nowrap; border:1px solid var(--line); background:var(--surface);
  color:var(--text); border-radius:999px; padding:9px 14px; font:500 13px/1 inherit; cursor:pointer;
  font-family:inherit; transition:background .15s, border-color .15s}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.chip .pct{margin-left:8px; font:400 11px/1 "IBM Plex Mono",ui-monospace,monospace;
  opacity:.7; font-variant-numeric:tabular-nums}
.tempolive{font:500 12px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--muted);
  font-variant-numeric:tabular-nums}

/* ---------- mixer ---------- */
.mixer{display:flex; flex-direction:column; gap:8px}
.ch{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:11px 13px 12px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.ch::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--hue)}
.ch.mine{border-color:var(--hue)}
.ch.off{opacity:.45}
.chead{display:flex; align-items:center; gap:10px}
.badge{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; flex:none;
  background:color-mix(in srgb, var(--hue) 18%, transparent); color:var(--hue);
  font:600 14px/1 Oswald,"Arial Narrow",sans-serif}
.cname{font-weight:500; font-size:14px}
.cwho{font-size:11px; color:var(--muted); margin-top:1px}
.btns{margin-left:auto; display:flex; gap:6px}
.tog{appearance:none; width:34px; height:30px; border-radius:8px; border:1px solid var(--line);
  background:var(--raise); color:var(--muted); font:600 11px/1 inherit; font-family:inherit;
  cursor:pointer; letter-spacing:.04em; transition:background .13s, color .13s, border-color .13s}
.tog[aria-pressed="true"]{background:var(--hue); border-color:var(--hue); color:var(--ink)}
.tog:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.faderow{display:flex; align-items:center; gap:10px; margin-top:10px}
.val{font:400 11px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--muted);
  font-variant-numeric:tabular-nums; width:30px; text-align:right; flex:none}
.panrow{display:none; align-items:center; gap:10px; margin-top:9px;
  padding-top:9px; border-top:1px dashed var(--line)}
.mixer.showpan .panrow{display:flex}
.panlab{font:500 9px/1 inherit; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  width:30px; flex:none}

input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:26px;
  background:transparent; cursor:pointer; margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px; border-radius:3px; background:var(--track)}
input[type=range]::-moz-range-track{height:5px; border-radius:3px; background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px;
  border-radius:50%; background:var(--hue,var(--accent)); margin-top:-8.5px;
  border:2px solid var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:22px; height:22px; border:2px solid var(--surface);
  border-radius:50%; background:var(--hue,var(--accent)); box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}

/* ---------- lyrics ---------- */
.lyr{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 15px;
  min-height:104px; display:flex; flex-direction:column; justify-content:center; gap:7px}
.lyr .line{font:400 17px/1.42 "IBM Plex Sans",sans-serif; color:var(--muted); transition:color .2s}
.lyr .line.now{color:var(--text)}
.lyr .syl.sung{color:var(--p-s); font-weight:500}
.lyr .who{font:500 10px/1 inherit; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* ---------- transport ---------- */
.tp{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
  background:var(--surface); border-top:1px solid var(--line); z-index:30;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 28px -18px rgba(0,0,0,.7)}
.loopbar{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.loopbtn{appearance:none; border:1px solid var(--line); background:var(--raise); color:var(--muted);
  border-radius:8px; padding:7px 11px; font:500 12px/1 inherit; font-family:inherit; cursor:pointer;
  display:flex; align-items:center; gap:6px; transition:background .15s, color .15s, border-color .15s}
.loopbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.loopbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.scrub{flex:1; --hue:var(--accent)}
.tpmain{display:flex; align-items:center; gap:12px}
.play{appearance:none; width:56px; height:56px; flex:none; border-radius:50%; border:none;
  background:var(--accent); color:var(--accent-ink); cursor:pointer; display:grid; place-items:center;
  box-shadow:0 3px 12px -3px color-mix(in srgb, var(--accent) 55%, transparent)}
.play:focus-visible{outline:2px solid var(--text); outline-offset:3px}
.play svg{width:23px; height:23px; fill:currentColor}
.tpmeta{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
.time{font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--muted);
  font-variant-numeric:tabular-nums}
.tempo{display:flex; align-items:center; gap:9px}
.tempo .val{width:52px}
.tempo input{--hue:var(--muted)}

.note{font-size:12px; line-height:1.55; color:var(--muted); border-top:1px solid var(--line);
  padding-top:14px}
.note b{color:var(--text); font-weight:500}
.note code{font:400 11px/1 "IBM Plex Mono",monospace; background:var(--raise);
  padding:2px 5px; border-radius:4px; border:1px solid var(--line)}
.note p{margin:0 0 9px}
.note p:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>

<div class="shell">
  <div class="loadscreen" id="loadScreen">
    <div class="loadbox">
      <div class="loadtitle" id="loadTitle">Loading your show…</div>
      <div class="loadmsg" id="loadMsg">Fetching the song data and audio from Google Drive.</div>
      <button class="mini" id="retryBtn" hidden>Retry</button>
    </div>
  </div>

  <header class="top" id="topBar" hidden>
    <div class="eyebrow">Rehearsal mix · Bar-by-bar</div>
    <div class="songrow">
      <div class="song" id="songTitle">—</div>
      <div class="keysig" id="showName">—</div>
    </div>
    <div class="counter">
      <div class="bigbar"><span id="barNum">1</span><small>/<span id="barTot">1</span></small></div>
      <div class="beats" id="beats"></div>
    </div>
  </header>

  <main class="body" id="mainBody" hidden>
    <div class="notice" id="notesBlock"></div>

    <section class="block">
      <h2>I'm singing</h2>
      <div class="parts-pick" id="myPart"></div>
    </section>

    <section class="block">
      <h2>Balance</h2>
      <div class="chips" id="presets"></div>
    </section>

    <section class="block">
      <div class="h2row">
        <h2>Tempo</h2>
        <div class="tempolive" id="tempoLive">100%</div>
      </div>
      <div class="chips" id="sections"></div>
    </section>

    <section class="block">
      <div class="h2row">
        <h2>Mixer</h2>
        <button class="mini" id="panBtn" aria-pressed="false">Stereo</button>
      </div>
      <div class="mixer" id="mixer"></div>
    </section>

    <section class="block" id="lyricsBlock" hidden>
      <h2>Words</h2>
      <div class="lyr" id="lyrics">
        <div class="who" id="lyrWho">—</div>
        <div class="line now" id="lyrNow">—</div>
        <div class="line" id="lyrNext"></div>
      </div>
    </section>
  </main>

  <div class="tp" id="transport" hidden>
    <div class="loopbar">
      <button class="loopbtn" id="loopBtn" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg>
        <span id="loopLbl">Loop</span>
      </button>
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" aria-label="Position">
      <button class="loopbtn" id="clickBtn" aria-pressed="true" title="Count-in and click">Click</button>
    </div>
    <div class="tpmain">
      <button class="play" id="play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="tpmeta">
        <div class="time"><span id="tCur">0:00</span> / <span id="tTot">0:00</span><span id="loopInfo"></span></div>
        <div class="tempo">
          <input type="range" id="tempo" min="60" max="140" value="100" aria-label="Tempo">
          <div class="val" id="tempoVal">100%</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* This page has no Claude/window.claude dependency at all — it's a plain
   static page reading directly from Google Drive's public REST API, so
   anyone with the shared folder link can open it and play. See README
   next to this file for the one-time setup (API key + Drive sharing). */

// ---- fill this in once, after creating a Google Cloud API key restricted
// to the Drive API and to this page's domain (see the setup README) ----
const API_KEY = "AIzaSyCutp5LsbZTuTgkRtH-NAlq6P5Yip29yQM";
const DRIVE_FOLDER_ID = "1GXON0YJumc079WF5TWvb34GxN6iAXlsW"; // "Guys and Dolls / lbal"

const $ = s => document.querySelector(s);
const DRIVE_FILES = "https://www.googleapis.com/drive/v3/files";

async function driveFetchJson(url){
  const res = await fetch(url);
  if (!res.ok) {
    const err = new Error(`Drive request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function loadEverything(){
  const screen = $("#loadScreen"), title = $("#loadTitle"), msg = $("#loadMsg"), retry = $("#retryBtn");
  retry.hidden = true;
  title.textContent = "Loading your show…";
  msg.textContent = "Fetching the song data and audio from Google Drive.";

  if (!API_KEY || API_KEY === "PASTE_YOUR_GOOGLE_DRIVE_API_KEY_HERE"){
    title.textContent = "Setup needed";
    msg.textContent = "This page needs a Google Drive API key before it can load anything — see the setup README next to this file.";
    return;
  }

  try {
    const list = await driveFetchJson(
      `${DRIVE_FILES}?q=${encodeURIComponent(`'${DRIVE_FOLDER_ID}' in parents and trashed = false`)}&key=${API_KEY}&fields=files(id,name)`
    );
    const files = list.files || [];
    const byName = name => files.find(f => f.name === name);

    const scoreFile = byName("lbal-score.json");
    if (!scoreFile) throw Object.assign(new Error("lbal-score.json not found in the Drive folder"), {status: "missing_score"});
    const SCORE = await driveFetchJson(`${DRIVE_FILES}/${scoreFile.id}?alt=media&key=${API_KEY}`);

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buffers = {};
    await Promise.all(SCORE.parts.map(async p => {
      const f = byName(p.audioFile);
      if (!f) throw Object.assign(new Error(`${p.audioFile} not found in the Drive folder`), {status: "missing_audio"});
      const res = await fetch(`${DRIVE_FILES}/${f.id}?alt=media&key=${API_KEY}`);
      if (!res.ok) throw Object.assign(new Error(`Couldn't download ${p.audioFile} (${res.status})`), {status: res.status});
      const arr = await res.arrayBuffer();
      buffers[p.id] = await ctx.decodeAudioData(arr);
    }));

    screen.hidden = true;
    $("#topBar").hidden = false;
    $("#mainBody").hidden = false;
    $("#transport").hidden = false;
    initApp(SCORE, ctx, buffers);
  } catch (err) {
    title.textContent = "Couldn't load from Drive";
    msg.textContent = driveErrText(err);
    retry.hidden = false;
  }
}

function driveErrText(err){
  const status = err && err.status;
  if (status === 403) return "Drive returned 403 — either the folder isn't shared as \"Anyone with the link\" yet, or the API key isn't allowed to call the Drive API from this domain.";
  if (status === 404 || status === "missing_score" || status === "missing_audio") return err.message + " — check the folder and file names match what's expected.";
  if (status === 400) return "Drive rejected the request (400) — the API key is probably missing or malformed.";
  return (err && err.message) || "Something went wrong talking to Drive.";
}

/* ================= app (runs once SCORE + audio are loaded) ================= */
function initApp(SCORE, ctx, buffers){
  const PARTS = SCORE.parts;
  let nodes = {}, sources = {};
  let playing = false, startCtxTime = 0, startPos = 0, raf = 0;
  let myPart = PARTS.find(p => p.id !== "piano")?.id || PARTS[0].id;
  let activePreset = "full", loopOn = false, clickOn = true;
  let loopA = 0, loopB = Math.max(1, SCORE.measures.length - 1);
  let rate = 1;
  const state = {};
  PARTS.forEach(p => state[p.id] = {vol:0.85, pan:p.pan, mute:false, solo:false});

  const bars = SCORE.measures.map(m => m.seconds);
  let DUR = Math.max(SCORE.duration, ...Object.values(buffers).map(b => b.duration));
  const beatsPerBar = SCORE.measures[0].beats || SCORE.beatsPerBarDefault || 4;

  const PRESETS = [
    {id:"full",  label:"Full mix",      hint:"Everything, evenly balanced"},
    {id:"loud",  label:"Mine louder",   hint:"Your line on top, others underneath"},
    {id:"only",  label:"Mine only",     hint:"Your line alone with the piano"},
    {id:"drop",  label:"Drop mine",     hint:"Everyone but you — sing your own line"},
    {id:"wide",  label:"Spread out",    hint:"Parts pushed apart across the stereo field"}
  ];

  const SECTIONS = (SCORE.sections || [{id:"all", label:"Whole song", bar:0, pct:1}])
    .map(s => ({...s}));
  let currentSectionId = SECTIONS[0].id;
  const sectionAt = pos => {
    let s = SECTIONS[0];
    for (const sec of SECTIONS) if (bars[sec.bar] <= pos) s = sec; else break;
    return s;
  };
  const section = id => SECTIONS.find(s => s.id === id);

  $("#songTitle").textContent = SCORE.title;
  $("#showName").textContent = SCORE.show;

  const noteLines = Object.values(SCORE.notes || {});
  $("#notesBlock").innerHTML = noteLines.length
    ? `<span>${noteLines.map(t => `<b>·</b> ${t}`).join("<br><br>")}</span>` : "";

  if (SCORE.lyrics && SCORE.lyrics.length) $("#lyricsBlock").hidden = false;

  function buildMixer(){
    $("#mixer").innerHTML = PARTS.map(p => `
      <div class="ch" id="ch-${p.id}" style="--hue:${p.hue}">
        <div class="chead">
          <div class="badge">${p.id[0].toUpperCase()}</div>
          <div>
            <div class="cname">${p.label}</div>
            <div class="cwho" id="who-${p.id}">${p.who}</div>
          </div>
          <div class="btns">
            <button class="tog" data-solo="${p.id}" aria-pressed="false" title="Solo ${p.label}">S</button>
            <button class="tog" data-mute="${p.id}" aria-pressed="false" title="Mute ${p.label}">M</button>
          </div>
        </div>
        <div class="faderow">
          <input type="range" data-vol="${p.id}" min="0" max="100" value="85" aria-label="${p.label} volume">
          <div class="val" id="v-${p.id}">85</div>
        </div>
        <div class="panrow">
          <div class="panlab">Pan</div>
          <input type="range" data-pan="${p.id}" min="-100" max="100" value="${p.pan*100}" aria-label="${p.label} pan">
          <div class="val" id="p-${p.id}">${panLabel(p.pan)}</div>
        </div>
      </div>`).join("");

    $("#myPart").innerHTML = PARTS.filter(p => p.id !== "piano").map(p => `
      <button class="pick" data-my="${p.id}" aria-pressed="${p.id===myPart}" style="color:${p.hue}">
        <b>${p.id[0].toUpperCase()}</b><span>${p.id[0].toUpperCase()+p.id.slice(1)}</span>
      </button>`).join("") +
      `<button class="pick" data-my="none" aria-pressed="false"><b>·</b><span>None</span></button>`;

    $("#presets").innerHTML = PRESETS.map(p =>
      `<button class="chip" data-preset="${p.id}" aria-pressed="${p.id===activePreset}" title="${p.hint}">${p.label}</button>`
    ).join("");

    $("#beats").innerHTML = Array.from({length:beatsPerBar},
      (_,i)=>`<div class="beat${i===0?" one":""}" data-beat="${i}"></div>`).join("");
    $("#barTot").textContent = bars.length;

    $("#sections").innerHTML = SECTIONS.map(s => `
      <button class="chip" data-section="${s.id}" aria-pressed="${s.id===currentSectionId}">
        ${s.label}<span class="pct" id="pct-${s.id}">${Math.round(s.pct*100)}%</span>
      </button>`).join("");
  }

  function applyRateChange(newRate){
    if (ctx && playing){
      startPos = position();
      startCtxTime = ctx.currentTime;
      Object.values(sources).forEach(s => s.playbackRate.value = newRate);
    }
    rate = newRate;
  }
  function setRate(newRate, sec){
    sec.pct = newRate;
    applyRateChange(newRate);
    renderTempo();
  }
  function renderTempo(){
    const sec = section(currentSectionId);
    const t = $("#tempo");
    if (document.activeElement !== t) t.value = Math.round(sec.pct*100);
    $("#tempoVal").textContent = Math.round(sec.pct*100) + "%";
    $("#tempoLive").textContent = Math.round(sec.pct*100) + "% · " + sec.label;
    document.querySelectorAll("[data-section]").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.section === currentSectionId);
      const p = document.getElementById("pct-"+b.dataset.section);
      if (p) p.textContent = Math.round(section(b.dataset.section).pct*100) + "%";
    });
  }
  function jumpToSection(id){
    currentSectionId = id;
    rate = section(id).pct;
    const at = bars[section(id).bar];
    if (playing) startSources(at); else { startPos = at; render(); }
    renderTempo();
  }

  const panLabel = v => Math.abs(v) < 0.03 ? "C" : (v < 0 ? "L" : "R") + Math.round(Math.abs(v)*100);

  function audibleGain(id){
    const anySolo = PARTS.some(p => state[p.id].solo);
    const s = state[id];
    if (s.mute) return 0;
    if (anySolo && !s.solo) return 0;
    return s.vol;
  }

  function applyMix(){
    PARTS.forEach(p => {
      const s = state[p.id], g = audibleGain(p.id);
      if (!nodes[p.id]){
        const gain = ctx.createGain(), pan = ctx.createStereoPanner();
        gain.connect(pan); pan.connect(ctx.destination);
        nodes[p.id] = {gain, pan};
      }
      nodes[p.id].gain.gain.setTargetAtTime(g, ctx.currentTime, 0.02);
      nodes[p.id].pan.pan.setTargetAtTime(s.pan, ctx.currentTime, 0.02);
      const el = document.getElementById("ch-"+p.id);
      if (el) el.classList.toggle("off", g === 0);
      document.getElementById("v-"+p.id).textContent = Math.round(s.vol*100);
      document.getElementById("p-"+p.id).textContent = panLabel(s.pan);
      const vs = document.querySelector(`[data-vol="${p.id}"]`);
      if (vs && +vs.value !== Math.round(s.vol*100)) vs.value = Math.round(s.vol*100);
      const ps = document.querySelector(`[data-pan="${p.id}"]`);
      if (ps && +ps.value !== Math.round(s.pan*100)) ps.value = Math.round(s.pan*100);
      document.querySelector(`[data-solo="${p.id}"]`).setAttribute("aria-pressed", s.solo);
      document.querySelector(`[data-mute="${p.id}"]`).setAttribute("aria-pressed", s.mute);
    });
  }

  function position(){
    if (!ctx) return startPos;
    return playing ? startPos + (ctx.currentTime - startCtxTime) * rate : startPos;
  }

  function stopSources(){
    Object.values(sources).forEach(s => { try{ s.stop(); }catch(e){} });
    sources = {};
  }

  function startSources(at){
    clearCountIn();
    stopSources();
    PARTS.forEach(p => {
      const src = ctx.createBufferSource();
      src.buffer = buffers[p.id];
      src.playbackRate.value = rate;
      src.connect(nodes[p.id].gain);
      src.start(0, Math.max(0, Math.min(at, buffers[p.id].duration - 0.01)));
      sources[p.id] = src;
    });
    startCtxTime = ctx.currentTime;
    startPos = at;
    if (playing && !loopRunning) loopFrame();
  }

  function tick(strong){
    if (!clickOn || !ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = strong ? 1600 : 1100;
    g.gain.setValueAtTime(strong ? 0.16 : 0.09, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0005, ctx.currentTime + 0.06);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.07);
  }

  let countInTimers = [];
  function clearCountIn(){ countInTimers.forEach(clearTimeout); countInTimers = []; }

  async function play(){
    if (ctx.state === "suspended") await ctx.resume();
    const from = loopOn ? Math.max(position(), bars[loopA]) : position();
    const at = (loopOn && (from < bars[loopA] || from >= bars[loopB])) ? bars[loopA] : from;
    if (clickOn){
      const spb = barLen(0) / beatsPerBar;
      for (let i=0;i<beatsPerBar;i++)
        countInTimers.push(setTimeout(() => { tick(i===0); showBeat(i); }, i*spb*1000/rate));
      countInTimers.push(setTimeout(()=>reallyStart(at), beatsPerBar*spb*1000/rate));
    } else reallyStart(at);
    playing = true; setPlayIcon(true);
  }
  function reallyStart(at){ if (playing) startSources(at); }

  function pause(){
    const p = position();
    clearCountIn(); stopSources(); playing = false; loopRunning = false;
    startPos = Math.min(p, DUR);
    cancelAnimationFrame(raf); setPlayIcon(false); render();
  }

  const barLen = i => (i+1 < bars.length ? bars[i+1] : DUR) - bars[i];
  function setPlayIcon(on){
    $("#playIcon").innerHTML = on ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $("#play").setAttribute("aria-label", on ? "Pause" : "Play");
  }

  let lastBeat = -1, loopRunning = false;
  function loopFrame(){
    loopRunning = true;
    const pos = position();
    if (loopOn && pos >= bars[loopB]) { startSources(bars[loopA]); lastBeat = -1; }
    else if (pos >= DUR) { pause(); startPos = 0; render(); return; }
    render();
    const bi = barIndex(pos);
    const b = Math.floor((pos - bars[bi]) / (barLen(bi)/beatsPerBar));
    const key = bi*100+b;
    if (key !== lastBeat){ lastBeat = key; if (clickOn && playing) tick(b===0); }
    raf = requestAnimationFrame(loopFrame);
  }

  function barIndex(pos){
    let i = 0;
    while (i+1 < bars.length && bars[i+1] <= pos) i++;
    return i;
  }

  function render(){
    const pos = Math.min(position(), DUR);
    const bi = barIndex(pos);
    $("#barNum").textContent = bi + 1;
    const within = (pos - bars[bi]) / (barLen(bi)/beatsPerBar);
    const beat = Math.max(0, Math.min(beatsPerBar-1, Math.floor(within)));
    showBeat(playing ? beat : -1);
    $("#tCur").textContent = fmt(pos);
    const sc = $("#scrub");
    if (document.activeElement !== sc) sc.value = Math.round(pos/DUR*1000);
    renderLyrics(pos);

    const here = sectionAt(pos).id;
    if (here !== currentSectionId){
      currentSectionId = here;
      applyRateChange(section(here).pct);
      renderTempo();
    }
  }
  const fmt = s => Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  function showBeat(i){
    document.querySelectorAll(".beat").forEach((el,idx) => el.classList.toggle("on", idx===i));
  }

  const LY = SCORE.lyrics || [];
  function renderLyrics(pos){
    if (!LY.length) return;
    let idx = -1;
    for (let i=0;i<LY.length;i++) if (LY[i].seconds <= pos + 0.001) idx = i;
    const lo = Math.max(0, idx-5), hi = Math.min(LY.length, idx+7);
    $("#lyrNow").innerHTML = LY.slice(lo, hi).map((l,i)=>{
      const real = lo+i, sung = real <= idx;
      const sp = (l.syllabic === "begin" || l.syllabic === "middle") ? "" : " ";
      return `<span class="syl${sung?" sung":""}">${l.text}</span>${sp}`;
    }).join("");
    $("#lyrWho").textContent = (SCORE.lyricPart || "") + " line";
  }

  function applyPreset(id){
    activePreset = id;
    const mine = myPart;
    PARTS.forEach(p => {
      const s = state[p.id], isMine = p.id === mine, isPiano = p.id === "piano";
      s.mute = false; s.solo = false;
      s.pan = p.pan;
      if (id === "full")      s.vol = 0.85;
      else if (id === "loud") s.vol = isMine ? 1 : (isPiano ? 0.5 : 0.28);
      else if (id === "only") s.vol = isMine ? 1 : (isPiano ? 0.35 : 0);
      else if (id === "drop") s.vol = isMine ? 0 : 0.9;
      else if (id === "wide"){ s.vol = 0.85; s.pan = isPiano ? 0 : p.pan * 1.7; }
      s.pan = Math.max(-1, Math.min(1, s.pan));
    });
    document.querySelectorAll("[data-preset]").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.preset === id));
    applyMix();
    markMine();
  }
  function markMine(){
    PARTS.forEach(p => {
      const el = document.getElementById("ch-"+p.id);
      el.classList.toggle("mine", p.id === myPart);
      document.getElementById("who-"+p.id).textContent = p.id === myPart ? "Your line" : p.who;
    });
    document.querySelectorAll("[data-my]").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.my === myPart));
  }

  function wire(){
    document.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset.vol){ state[t.dataset.vol].vol = t.value/100; clearPreset(); applyMix(); }
      if (t.dataset.pan){ state[t.dataset.pan].pan = t.value/100; clearPreset(); applyMix(); }
      if (t.id === "scrub"){
        const at = t.value/1000*DUR;
        if (playing) startSources(at); else { startPos = at; render(); }
      }
      if (t.id === "tempo") setRate(t.value/100, section(currentSectionId));
    });

    document.addEventListener("click", async e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.solo){ const s = state[t.dataset.solo]; s.solo = !s.solo; clearPreset(); applyMix(); }
      if (t.dataset.mute){ const s = state[t.dataset.mute]; s.mute = !s.mute; clearPreset(); applyMix(); }
      if (t.dataset.my){ myPart = t.dataset.my; markMine(); if (activePreset) applyPreset(activePreset); }
      if (t.dataset.preset) applyPreset(t.dataset.preset);
      if (t.dataset.section) jumpToSection(t.dataset.section);
      if (t.id === "play") playing ? pause() : play();
      if (t.id === "loopBtn"){
        loopOn = !loopOn;
        t.setAttribute("aria-pressed", loopOn);
        $("#loopLbl").textContent = loopOn ? `Bars ${loopA+1}–${loopB+1}` : "Loop";
        $("#loopInfo").textContent = loopOn ? ` · looping ${loopA+1}–${loopB+1}` : "";
        if (loopOn && playing) startSources(bars[loopA]);
      }
      if (t.id === "clickBtn"){ clickOn = !clickOn; t.setAttribute("aria-pressed", clickOn); }
      if (t.id === "panBtn"){
        const on = t.getAttribute("aria-pressed") !== "true";
        t.setAttribute("aria-pressed", on);
        $("#mixer").classList.toggle("showpan", on);
      }
    });
  }
  function clearPreset(){
    activePreset = null;
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", false));
  }

  buildMixer();
  wire();
  applyPreset("full");
  markMine();
  renderTempo();
  $("#tTot").textContent = fmt(DUR);
  render();
}

$("#retryBtn").addEventListener("click", loadEverything);
loadEverything();
</script>
